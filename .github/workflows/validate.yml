name: Validate corpus and skill

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate sources
        run: python3 scripts/validate_sources.py
      - name: Validate corpus
        run: python3 scripts/validate_corpus.py
      - name: Validate skill
        run: python3 scripts/validate_skill.py
      - name: Run tests
        run: python3 -m unittest discover -s tests -v
